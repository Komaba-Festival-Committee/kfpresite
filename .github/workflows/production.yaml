name: Build and Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get token to access submodules
        id: get-kf-token
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.KF_CHECKOUT_SUBMODULES_APP_ID }}
          private_key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.get-kf-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build package
        env:
          NUXT_PUBLIC_LIFF_ID: ${{ secrets.PROD_LIFF_ID }}
          NUXT_PUBLIC_VOTE_API_URL: ${{ secrets.PROD_VOTE_API_URL }}
        run: bash build-prod.sh 

      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-production-${{ github.sha }}
          path: ./.output/production
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production 
    
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-production-${{ github.sha }}
          path: ./dist

      - name: Deploy to External Production System
        run: |
          echo "Deploying approved package to external system..."

      - name: Deploy to cloudflare PROD
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PROD }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PROD }}
          command: pages deploy dist --branch main --project-name=kfpresite-prod
