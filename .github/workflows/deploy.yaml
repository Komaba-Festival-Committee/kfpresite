name: Build and deploy to production

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get token to access submodules
        id: get-kf-token
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.KF_CHECKOUT_SUBMODULES_APP_ID }}
          private_key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.get-kf-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build package
        run: bash build-prod.sh 
          
      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-package
          path: ./.output

  # 2. Preview for review
  preview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-package
          path: ./.output

      - name: Make preview
        run: |
          echo "Deploying to preview environment..."

  # 3. Once approved, deploy to external system
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment: production 
    
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-package
          path: ./dist

      - name: Deploy to External Production System
        run: |
          echo "Deploying approved package to external system..."
