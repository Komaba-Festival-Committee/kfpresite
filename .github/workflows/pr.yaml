name: Build and generate preview, then comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get token to access submodules
        id: get-kf-token
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.KF_CHECKOUT_SUBMODULES_APP_ID }}
          private_key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.get-kf-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build package
        run: bash build-qa.sh 
          
      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-qa-${{ github.event.pull_request.head.sha }}
          path: ./.output/qa
          include-hidden-files: true

  preview:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-qa-${{ github.event.pull_request.head.sha }}
          path: ./qa

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install lightweight server
        run: npm install -g serve
 
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
 
      - name: Find files
        run: find .
 
      - name: Start Local Server
        run: |
           serve -s qa -l 3000 & 
           echo "Server starting on port 3000..."
 
      - name: Wait for server to be responsive
        run: |
             npx wait-on http://localhost:3000/77 --timeout 30000
 
      - name: Take Local Preview Screenshot
        run: |
          npx --package=playwright node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 720 });
            await page.goto('http://localhost:3000', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'screenshot.png' });
            await browser.close();
          })();
 
      - name: Upload Screenshot Artifact
        id: upload_screenshot
        uses: actions/upload-artifact@v4
        with:
          name: local-preview-screenshot
          path: screenshot.png
 
      - name: Post Preview Comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-environment
          message: |
             ## Local Build Visual Verification
             
             The package compiled successfully. Below is a rendered visual screenshot captured directly from the local build runner.
             
             ### Visual Screenshot
             ![Preview Screenshot](${{ steps.upload_screenshot.outputs.artifact-url }}/screenshot.png)
             
             _Generated on: ${{ github.event.pull_request.updated_at }}_
