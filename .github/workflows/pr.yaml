name: Build and generate preview, then comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get token to access submodules
        id: get-kf-token
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.KF_CHECKOUT_SUBMODULES_APP_ID }}
          private_key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.get-kf-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build package
        run: bash build-qa.sh 
          
      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-qa-${{ github.event.pull_request.head.sha }}
          path: ./.output/qa
          include-hidden-files: true

  preview:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-qa-${{ github.event.pull_request.head.sha }}
          path: ./qa

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: npm install playwright
 
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
 
      - name: Find files
        run: find .
 
      - name: Start Local Server
        run: |
           npx serve qa -l 3000 & 
           echo "Server starting on port 3000..."
 
      - name: Wait for server to be responsive
        run: |
             npx wait-on http://localhost:3000/77 --timeout 30000
 
      - name: Take Local Preview Screenshots
        run: |
          node -e "
          const { chromium } = require('playwright');
          const viewports = {
            desktop: { width: 1280, height: 720 },
            mobile: { width: 390, height: 844 }
          };
          const pages = {
            home: '/',
            about: '/about'
          };
          (async () => {
            const browser = await chromium.launch();
            for (const [pageName, path] of Object.entries(pages)) {
              for (const [viewportName, size] of Object.entries(viewports)) {
                const page = await browser.newPage();
                await page.setViewportSize(size);
                await page.goto('http://localhost:3000/77' + path, { waitUntil: 'networkidle' });
                await page.screenshot({ path: 'screenshot-' + pageName + '-' + viewportName + '.png' });
                await page.close();
              }
            }
            await browser.close();
          })();
          "

      - name: Verify that screenshot exists
        run: ls *.png

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="pr-images-${{ github.event.pull_request.head.sha }}"
          gh release create $RELEASE_TAG --repo "$GITHUB_REPOSITORY" --notes "Image Upload Generated for PR Review" || true
          gh release upload $RELEASE_TAG *.png --repo "$GITHUB_REPOSITORY" --clobber

      - name: Comment PR with Image URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="pr-images-${{ github.event.pull_request.head.sha }}"
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/screenshot.png"
          gh issue comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "## Website preview generated by GitHub Actions

          ### Home
          **Desktop**
          ![Home Desktop](${BASE_URL}/screenshot-home-desktop.png)

          **Mobile**
          ![Home Mobile](${BASE_URL}/screenshot-home-mobile.png)

          ### About
          **Desktop**
          ![About Desktop](${BASE_URL}/screenshot-about-desktop.png)

          **Mobile**
          ![About Mobile](${BASE_URL}/screenshot-about-mobile.png)"
 
