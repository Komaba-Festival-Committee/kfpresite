name: Build and Deploy to QA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get token to access submodules
        id: get-kf-token
        uses: getsentry/action-github-app-token@v4.0.0
        with:
          app_id: ${{ secrets.KF_CHECKOUT_SUBMODULES_APP_ID }}
          private_key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.get-kf-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Build package
        env:
          NUXT_PUBLIC_LIFF_ID: ${{ secrets.QA_LIFF_ID }}
          NUXT_PUBLIC_VOTE_API_URL: ${{ secrets.QA_VOTE_API_URL }}
        run: bash build-qa.sh 
          
      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-qa-${{ github.sha }}
          path: ./.output/qa
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: qa 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-qa-${{ github.sha }}
          path: ./dist

      - name: Deploy to External QA System
        run: |
          echo "Deploying approved package to external system..."

      - name: Deploy to cloudflare QA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_QA }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_QA }}
          command: pages deploy dist --branch main --project-name=kfpresite-qa
